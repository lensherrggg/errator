[package]
name = "errator"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "本地文本勘误报告生成器 / Local text proofreading report generator"
license = "MIT"
readme = "README.md"
keywords = ["proofreading", "chinese", "cli", "tui", "onnx"]
categories = ["command-line-utilities", "text-processing"]
default-run = "errator"
build = "build.rs"

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:ratatui"]
# Optional ONNX Runtime semantic backend. Kept off by default so the core
# tool remains a small, offline, CPU-only binary with no native runtime.
# `semantic` links ONNX Runtime 1.22, the last line with a bundled DirectML EP.
semantic = ["dep:ort"]
semantic-directml = ["semantic", "ort/directml"]
semantic-coreml = ["semantic", "ort/coreml"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dirs = "6.0"
regex = "1.11"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
unicode-width = "0.2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }
# Pinned intentionally: ONNX Runtime 1.22 is the last compatible ORT line with
# DirectML before the 1.25 packaging change called out in the PRD.
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "download-binaries", "ndarray", "copy-dylibs"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
